<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"><rect width="1280" height="640" rx="24" fill="#f3f5f0"/><rect width="230" height="640" rx="24" fill="white"/><g font-family="Segoe UI,Arial,sans-serif"><text x="34" y="62" fill="#174d40" font-size="25" font-weight="700">↗ RailRecover.</text><text x="34" y="126" fill="#718177" font-size="11" letter-spacing="2">RECOVERY WORKSPACE</text><rect x="20" y="151" width="190" height="45" rx="8" fill="#e9f0e2"/><text x="35" y="180" font-size="14" fill="#174d40">Passenger portal</text><text x="35" y="229" font-size="14" fill="#718177">Operations desk</text><text x="35" y="277" font-size="14" fill="#718177">Case study</text><text x="270" y="45" font-size="11" fill="#718177" letter-spacing="2">INDEPENDENT OPERATIONAL PROTOTYPE</text><text x="270" y="87" font-size="34" fill="#183833">A clear path back.</text><rect x="270" y="118" width="960" height="218" rx="14" fill="#174d40"/><text x="305" y="159" font-size="11" fill="#cfe1bf" letter-spacing="2">LESS UNCERTAINTY. MORE ACCOUNTABILITY.</text><text x="305" y="211" font-size="34" fill="white">A lost item shouldn't</text><text x="305" y="254" font-size="34" fill="white">mean a lost trail.</text><text x="305" y="296" font-size="14" fill="#c5d7c9">Report → accountable search → verified return</text><path d="M1000 165V290" stroke="#89ac78" stroke-width="3"/><g fill="#d4e9a7"><circle cx="1000" cy="165" r="7"/><circle cx="1000" cy="227" r="7"/><circle cx="1000" cy="290" r="7"/></g><g fill="#e5eedb" font-size="13"><text x="1020" y="169">REPORT</text><text x="1020" y="231">SEARCH</text><text x="1020" y="294">RETURN</text></g><text x="270" y="384" font-size="20" fill="#183833">Every update needs evidence.</text><rect x="270" y="405" width="465" height="154" rx="12" fill="white" stroke="#dce4dc"/><text x="294" y="438" font-size="11" fill="#718177">PASSENGER VIEW</text><text x="294" y="471" font-size="20" fill="#183833">Who is handling my case?</text><text x="294" y="505" font-size="14" fill="#718177">Assigned team · actual progress · next update</text><rect x="755" y="405" width="475" height="154" rx="12" fill="white" stroke="#dce4dc"/><text x="779" y="438" font-size="11" fill="#718177">OPERATIONS VIEW</text><text x="779" y="471" font-size="20" fill="#183833">What action is needed next?</text><text x="779" y="505" font-size="14" fill="#718177">Search queue · match review · custody history</text><text x="270" y="603" font-size="12" fill="#718177">Illustrated product overview • Synthetic data • No affiliation with Deutsche Bahn</text></g></svg>